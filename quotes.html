<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote requests · SolarSphere</title><link rel="stylesheet" href="portal.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header><div class="bar"><a class="brand" href="/">SolarSphere</a><nav class="links"><a href="/offers.html">Offers</a><a href="/emi.html">EMI calculator</a><span id="userName" class="muted"></span><button id="logout" class="button" hidden>Sign out</button></nav></div></header><main class="wrap"><section class="panel"><span class="tag">Save a sample request</span><h1>Request an estimate</h1><p class="muted">Use fictional contact details only. The local database stores requests for this local website.</p><div id="notice" class="notice" hidden></div><form id="quoteForm"><label>Sample company and package<select id="packageId" name="packageId" required></select></label><div class="fields"><label>Monthly electricity bill ₹<input name="monthlyBill" type="number" min="1" required></label><label>Usable roof area (sq. ft.)<input name="roofArea" type="number" min="1" required></label><label>Jalgaon area pincode<input name="pincode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label></div><label>Installation address<textarea name="address" required maxlength="500"></textarea></label><button class="button">Save sample request</button></form></section><section><h2>My saved requests</h2><div id="myQuotes" class="grid"></div></section></main><footer class="foot">Request details stay in your local SolarSphere database.</footer><script src="app.js"></script></body></html>
